<h1>Agent Village</h1>
<p>Agent Village is a private, personal tool that runs on its owner's own computer. It reads the owner's Gmail inbox (read-only) once a day and sends the owner a short summary via Telegram.</p>
<p>It is not a public service and has a single user: its owner.</p>
